
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Little Sound World</title>

<style>
:root {
  --cream: #fffaf1;
  --paper: #ffffff;
  --ink: #4d4842;
  --muted: #807b75;
  --blue: #91b7d9;
  --blue-dark: #527da5;
  --blue-light: #eaf3fc;
  --pink: #e8acba;
  --pink-light: #fcecf1;
  --yellow: #f1d28b;
  --yellow-light: #fff3d4;
  --brown: #bd997b;
  --line: #e9e1d7;
  --shadow: 0 5px 0 #eae3d9;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: "Nunito", "Pretendard", "Noto Sans KR",
    "Apple SD Gothic Neo", Arial, sans-serif;
  font-size: 18px;
  line-height: 1.65;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
  touch-action: manipulation;
  transition: .18s ease;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

button:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #b68548;
  outline-offset: 4px;
}

button:not(:disabled):active {
  transform: translateY(2px);
}

h1, h2, h3, p {
  margin-top: 0;
}

h1 {
  font-size: clamp(34px, 5vw, 64px);
  line-height: 1.2;
  letter-spacing: -1.5px;
}

h2 {
  font-size: clamp(25px, 3vw, 35px);
  line-height: 1.3;
}

h3 {
  font-size: 22px;
}

.hidden {
  display: none !important;
}

.center {
  text-align: center;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 14px;
}

header {
  background: #fffdf9;
  border-bottom: 2px solid var(--line);
  padding: 14px 4%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 30;
}

.logo {
  border: 0;
  background: transparent;
  font-size: clamp(17px, 2.4vw, 25px);
  font-weight: 900;
  color: #987557;
  text-align: left;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.coin-badge {
  background: var(--yellow-light);
  border: 2px solid #ecd39d;
  border-radius: 30px;
  padding: 7px 16px;
  font-weight: 900;
  white-space: nowrap;
  color: #977339;
}

main {
  width: min(1380px, 96%);
  margin: 22px auto 50px;
}

footer {
  padding: 20px;
  color: #9d9286;
  font-size: 13px;
  text-align: center;
}

.screen {
  animation: appear .3s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.btn {
  border: 0;
  border-radius: 15px;
  padding: 12px 20px;
  font-weight: 800;
  background: #f1ece4;
  box-shadow: 0 4px 0 #e0d7ca;
}

.btn-blue {
  background: #8fb5d9;
  color: #263f58;
  box-shadow: 0 4px 0 #7097bd;
}

.btn-pink {
  background: #f2ced9;
  color: #764e5c;
  box-shadow: 0 4px 0 #deb0bd;
}

.btn-yellow {
  background: #f5daa0;
  color: #765b2d;
  box-shadow: 0 4px 0 #dfbf78;
}

.btn-white {
  background: white;
  border: 2px solid var(--line);
  box-shadow: none;
}

.btn-small {
  font-size: 14px;
  padding: 8px 12px;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 18px 0;
}

.panel {
  background: white;
  border: 2px solid var(--line);
  border-radius: 24px;
  padding: clamp(17px, 3vw, 30px);
  box-shadow: var(--shadow);
}

.tag {
  display: inline-block;
  background: #f5eee3;
  color: #927454;
  border-radius: 20px;
  padding: 5px 14px;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 1px;
}

.notice {
  background: #f6f3ee;
  color: #78726a;
  padding: 13px 16px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.65;
  margin-top: 17px;
}

.goal-box {
  background: #fff3d8;
  border: 2px solid #f0dfba;
  padding: 17px 23px;
  border-radius: 18px;
  margin: 20px 0;
}

.two-col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.hero {
  border: 2px solid #e4dac9;
  border-radius: 30px;
  overflow: hidden;
  background: linear-gradient(120deg, #fef3de, #e8f1fa);
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  min-height: 325px;
}

.hero-copy {
  padding: 35px;
}

.hero h1 {
  color: #997252;
  margin: 15px 0;
}

.hero p {
  margin-bottom: 5px;
}

.hero-picture {
  width: 100%;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-picture svg {
  width: 100%;
}

.world-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  margin: 20px 0;
}

.world-card {
  background: white;
  border: 2px solid var(--line);
  border-radius: 23px;
  padding: 0;
  overflow: hidden;
  text-align: left;
  box-shadow: var(--shadow);
}

.world-card:hover {
  transform: translateY(-4px);
  border-color: #c3a98c;
}

.world-preview {
  background: #f4eee3;
  height: 160px;
  overflow: hidden;
}

.world-preview svg {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.world-info {
  padding: 19px;
}

.world-info h3 {
  font-size: 20px;
  margin: 7px 0;
}

.world-info p {
  margin: 7px 0;
}

.phoneme-label {
  color: #587eaa;
  font-size: 24px;
  font-weight: 900;
}

.complete-tag {
  font-size: 12px;
  background: #fff0c8;
  color: #9c783c;
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-block;
}

.section-heading {
  margin: 28px 0 10px;
}

.progress {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px;
  margin-bottom: 23px;
}

.progress-step {
  text-align: center;
  border: 2px solid var(--line);
  background: white;
  border-radius: 17px;
  padding: 12px 8px;
  color: #a1988e;
  font-size: 14px;
  font-weight: 800;
}

.progress-step span {
  display: block;
  font-size: 28px;
}

.progress-step.active {
  background: #eaf3fc;
  border-color: #9ebcda;
  color: #527da5;
}

.progress-step.done {
  background: #fff3d4;
  color: #977746;
  border-color: #ead3a1;
}

.friend-message {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border: 2px solid #e5d8c7;
  background: #fff9ed;
  border-radius: 20px;
  margin: 16px 0;
}

.friend-message svg {
  width: 82px;
  height: 82px;
  flex-shrink: 0;
}

.friend-message p {
  margin: 0;
}

.friend-name {
  color: #a17d56;
  font-size: 14px;
  font-weight: 900;
  margin-bottom: 3px;
}

.sound-card {
  border: 2px solid #dce7f3;
  border-radius: 21px;
  background: #f0f6fc;
  padding: 22px;
  text-align: center;
}

.sound-card.second {
  background: #fff1f4;
  border-color: #f0d7de;
}

.sound-symbol {
  font-size: 44px;
  font-weight: 900;
  color: #557da7;
}

.sound-card.second .sound-symbol {
  color: #b5768a;
}

.word {
  font-size: 34px;
  font-weight: 900;
  line-height: 1.25;
}

.word-icon {
  font-size: 61px;
  line-height: 1.4;
  display: block;
}

.mouth-picture {
  max-width: 200px;
  margin: 12px auto;
}

.mouth-picture svg {
  width: 100%;
}

.experiment {
  background: #fff8e8;
  border: 2px dashed #e2c99b;
  border-radius: 20px;
  padding: 21px;
  margin-top: 20px;
}

.answer-options {
  display: grid;
  gap: 10px;
}

.answer-button {
  border: 2px solid var(--line);
  background: white;
  padding: 13px 17px;
  text-align: left;
  border-radius: 13px;
  font-weight: 700;
}

.correct {
  border-color: #7ca3ca !important;
  background: #e6f0fc !important;
}

.incorrect {
  border-color: #df9cae !important;
  background: #fff0f2 !important;
}

.feedback {
  padding: 15px 18px;
  border-radius: 15px;
  margin-top: 15px;
  font-size: 16px;
  font-weight: 700;
}

.feedback:empty {
  display: none;
}

.feedback.good {
  background: #eaf3fc;
  color: #486d94;
}

.feedback.retry {
  background: #fff1e2;
  color: #956a43;
}

.feedback.neutral {
  background: #f1eee9;
  color: #756e65;
}

.speaker-button {
  display: block;
  width: 100px;
  height: 100px;
  margin: 18px auto;
  border: 4px solid #c9dbed;
  border-radius: 50%;
  background: #e4effc;
  font-size: 42px;
  box-shadow: 0 5px 0 #bfcee0;
}

.listening-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 18px;
  margin-top: 20px;
}

.listening-choice {
  border: 3px solid var(--line);
  border-radius: 23px;
  background: #fffdfa;
  padding: 20px;
  min-height: 170px;
  text-align: center;
}

.recorder {
  border: 2px solid #e9e2d8;
  border-radius: 19px;
  background: #faf8f3;
  padding: 17px;
  text-align: center;
  margin: 17px 0;
}

.record-status {
  color: #837b71;
  font-size: 14px;
}

audio {
  width: min(100%, 340px);
  height: 43px;
  margin: 10px 0;
}

.check-line {
  display: flex;
  align-items: flex-start;
  text-align: left;
  gap: 11px;
  margin: 13px 0;
  cursor: pointer;
}

.check-line input {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  accent-color: #7e9fc4;
  margin-top: 5px;
}

details {
  background: #f6f3ee;
  border-radius: 15px;
  padding: 13px 16px;
  margin: 14px 0;
}

summary {
  cursor: pointer;
  font-weight: 800;
  color: #79664e;
}

details p:last-child {
  margin-bottom: 0;
}

.world-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(330px, 1fr);
  align-items: start;
  gap: 18px;
}

.world-panel,
.shop-panel {
  background: white;
  border: 2px solid #e6ddce;
  border-radius: 22px;
  padding: 17px;
  box-shadow: var(--shadow);
}

.world-heading,
.shop-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.world-heading h2,
.shop-heading h2 {
  font-size: 23px;
  margin: 0;
}

.world-scene {
  position: relative;
  aspect-ratio: 1.35;
  width: 100%;
  background: #f4e9d5;
  border: 3px solid #e6d6bd;
  border-radius: 20px;
  overflow: hidden;
  isolation: isolate;
}

.scene-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.scene-bg svg {
  width: 100%;
  height: 100%;
}

.placement-grid {
  position: absolute;
  inset: 31% 6% 5%;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: 4px;
}

.plot {
  position: relative;
  border: 2px dashed transparent;
  background: transparent;
  min-width: 0;
  min-height: 0;
  border-radius: 10px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plot.available {
  border-color: #cbb28e;
  background: #fff9ed55;
}

.plot.available:hover {
  background: #fff6d5bb;
}

.plot.occupied:hover {
  border-color: #bc9970;
}

.plot.drag-over {
  border-color: #6c92ba;
  background: #dce9f8aa;
}

.plot.selected {
  border-color: #c18d4e;
  background: #fff3b777;
}

.placed-art {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  filter: drop-shadow(0 3px 1px #8a755233);
  pointer-events: none;
}

.placed-art svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.plot-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  font-size: clamp(8px, 1vw, 12px);
  color: #65513b;
  background: #fffaf1d9;
  border-radius: 8px;
  line-height: 1.25;
  font-weight: 800;
  pointer-events: none;
}

.world-caption {
  font-size: 13px;
  color: #8f7b66;
  margin-top: 8px;
}

.inventory-heading {
  font-size: 18px;
  font-weight: 900;
  margin: 17px 0 9px;
}

.inventory {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  min-height: 80px;
  border: 2px dashed #e5dac9;
  border-radius: 15px;
  padding: 10px;
  background: #fdfbf7;
}

.inventory-empty {
  color: #a39888;
  font-size: 14px;
  align-self: center;
}

.inventory-item {
  width: 84px;
  background: white;
  border: 2px solid #e7ddcd;
  border-radius: 12px;
  padding: 6px;
  text-align: center;
}

.inventory-item.selected {
  background: #fff3d3;
  border-color: #c8a268;
}

.inventory-item svg {
  height: 49px;
  width: 100%;
}

.inventory-item span {
  display: block;
  font-size: 12px;
  line-height: 1.3;
}

.collection-progress {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.collection-card {
  border: 2px solid #dfebf7;
  background: #f0f6fd;
  padding: 12px;
  border-radius: 14px;
  font-size: 14px;
  text-align: center;
}

.collection-card.second {
  background: #fff0f4;
  border-color: #f1d9e1;
}

.collection-card strong {
  font-size: 24px;
}

.collection-card.done {
  border-color: #d7b878;
  background: #fff5dc;
}

.shopkeeper {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border: 2px solid #eadac3;
  border-radius: 16px;
  background: #fff8eb;
  margin: 12px 0;
}

.shopkeeper svg {
  width: 70px;
  height: 70px;
  flex-shrink: 0;
}

.shopkeeper p {
  font-size: 17px;
  font-weight: 800;
  margin: 0;
}

.shop-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 9px;
}

.shop-item {
  min-width: 0;
  padding: 8px 4px;
  border: 2px solid #e9e1d5;
  border-radius: 15px;
  background: #fffdfa;
  text-align: center;
}

.shop-item.selected {
  border-color: #c6a06b;
  background: #fff3d6;
}

.shop-item-art {
  height: 70px;
  margin: 0 auto;
}

.shop-item-art svg {
  width: 100%;
  height: 100%;
}

.shop-word {
  font-weight: 900;
  font-size: 18px;
}

.shop-meaning {
  font-size: 12px;
  color: #81786a;
}

.shop-price {
  color: #a78342;
  font-size: 13px;
  font-weight: 800;
}

.shop-audio {
  background: white;
  border: 1px solid #e8dece;
  border-radius: 9px;
  font-size: 14px;
  margin-top: 5px;
  padding: 3px 9px;
}

.selection-heading {
  font-size: 15px;
  font-weight: 800;
  margin: 15px 0 7px;
}

.color-row,
.size-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.color-btn,
.size-btn {
  background: white;
  border: 2px solid var(--line);
  border-radius: 11px;
  padding: 7px 9px;
  font-size: 13px;
  font-weight: 700;
}

.color-btn.selected,
.size-btn.selected {
  background: #fff3d4;
  border-color: #c8a56b;
}

.color-dot {
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  vertical-align: middle;
  border: 1px solid #00000015;
  margin-right: 4px;
}

.private-plan {
  background: #f7f4ee;
  border-radius: 15px;
  padding: 13px;
  margin: 13px 0;
  font-size: 15px;
}

.frame {
  padding: 13px;
  background: white;
  border-radius: 12px;
  font-size: 20px;
  font-weight: 800;
  margin: 10px 0;
}

.speak-btn {
  width: 100%;
  background: #91b9df;
  border: 0;
  border-radius: 17px;
  padding: 15px;
  box-shadow: 0 5px 0 #719ac3;
  color: #284e73;
  font-size: 20px;
  font-weight: 900;
}

.speak-btn.recording {
  background: #edb1bb;
  box-shadow: 0 5px 0 #cf929c;
  color: #7d424e;
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  50% {
    opacity: .65;
  }
}

.consent {
  font-size: 12px;
  color: #807b72;
  line-height: 1.55;
}

.transcript {
  padding: 11px 15px;
  border-radius: 13px;
  background: #f4f2ed;
  font-size: 16px;
  overflow-wrap: anywhere;
  margin-top: 13px;
}

.offer {
  border: 2px solid #e8d9bf;
  background: #fff9ec;
  border-radius: 19px;
  padding: 16px;
  margin-top: 15px;
}

.offer-art {
  width: 130px;
  height: 130px;
  margin: 0 auto;
}

.offer-art svg {
  width: 100%;
  height: 100%;
}

.offer-word {
  font-size: 24px;
  text-align: center;
  font-weight: 900;
}

.repair-box {
  border: 2px solid #efd3c2;
  background: #fff2e8;
  padding: 15px;
  border-radius: 16px;
  margin: 14px 0;
}

.manual-box {
  background: #f5f7fa;
  border: 2px solid #e0e7f0;
  padding: 15px;
  border-radius: 16px;
  margin: 14px 0;
}

.manual-box select {
  display: block;
  width: 100%;
  border: 2px solid #e0ded8;
  border-radius: 10px;
  padding: 10px;
  margin: 7px 0 12px;
  background: white;
  color: var(--ink);
}

.bonus-panel {
  margin-top: 20px;
  border: 2px solid #e9d9bd;
  background: #fff9e9;
  border-radius: 20px;
  padding: 20px;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 12px;
  margin: 22px 0;
}

.summary-card {
  background: #f6f1e8;
  border-radius: 17px;
  padding: 17px 10px;
  text-align: center;
}

.summary-number {
  font-weight: 900;
  font-size: 34px;
  color: #a78255;
}

.summary-label {
  color: #877b6e;
  font-size: 13px;
}

.final-scene {
  max-width: 760px;
  margin: 20px auto;
}

.trophy {
  font-size: 75px;
}

@media (max-width: 1100px) {
  .world-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }

  .world-layout {
    grid-template-columns: minmax(0,1.1fr) minmax(300px,1fr);
  }

  .shop-item-art {
    height: 57px;
  }
}

@media (max-width: 780px) {
  body {
    font-size: 16px;
  }

  header {
    padding: 10px 3%;
  }

  .hero {
    grid-template-columns: 1fr;
  }

  .hero-copy {
    padding: 24px;
    text-align: center;
  }

  .hero-picture {
    min-height: 0;
  }

  .world-layout {
    grid-template-columns: 1fr;
  }

  .world-grid {
    gap: 10px;
  }

  .world-preview {
    height: 120px;
  }

  .world-info {
    padding: 13px;
  }

  .world-info h3 {
    font-size: 17px;
  }

  .two-col {
    gap: 10px;
  }

  .sound-card {
    padding: 13px;
  }

  .word {
    font-size: 29px;
  }

  .word-icon {
    font-size: 46px;
  }

  .sound-symbol {
    font-size: 36px;

function shuffle(arr) {
  const copy = [...arr];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function mouthSVG(type) {
  let shape = "";

  if (type === "r" || type === "l") {
    const tongue = type === "r"
      ? `
        <path d="M24 108 Q50 76 86 79
                 Q114 79 126 94
                 Q94 92 78 108 Z"
          fill="#e4a2b1" stroke="#b87988" stroke-width="2"/>

      : `
        <path d="M24 108 Q76 98 109 84
                 Q133 74 145 44
                 L153 48 Q136 100 90 108 Z"
          fill="#e4a2b1" stroke="#b87988" stroke-width="2"/>
        <circle cx="149" cy="45" r="5" fill="#edce84"/>
      `;

    shape = `
      <path d="M18 111 L18 58 Q57 22 117 23
               Q154 23 166 48 L185 65
               L166 74 L180 94 L160 112Z"
        fill="#f4dace" stroke="#c39a89" stroke-width="2"/>

               L159 54 L159 97 L37 105Z"
        fill="#834b59"/>
      <rect x="148" y="41" width="15" height="24"
        rx="3" fill="white"/>
      <rect x="148" y="93" width="15" height="15"
        rx="3" fill="white"/>
      ${tongue}
    `;

  } else if (type === "f") {

    shape = `
      <path d="M20 54 Q100 12 180 54
               Q100 71 20 54"
        fill="#e2a0ad" stroke="#b97d89" stroke-width="2"/>
      <path d="M25 59 Q100 42 175 59
               Q100 95 25 59" fill="#824653"/>
      ${Array.from({length:5}, (_,i) => `
        <rect x="${61+i*15}" y="53"

      `).join("")}
      <path d="M20 77 Q100 64 180 77
               Q100 125 20 77"
        fill="#efb4c0" stroke="#b97d89" stroke-width="2"/>
      <path d="M100 93 V124 M91 113 L100 124 L109 113"
        stroke="#789fc7" fill="none" stroke-width="3"/>
    `;

  } else if (type === "p") {

    shape = `
      <path d="M20 67 Q100 15 180 67
               Q100 78 20 67"
        fill="#e5a0ae" stroke="#b97d89" stroke-width="2"/>
      <path d="M20 68 Q100 78 180 68
               Q100 121 20 68"
        fill="#efb4c0" stroke="#b97d89" stroke-width="2"/>
      <path d="M20 67 Q100 74 180 67"
        stroke="#784655" stroke-width="3" fill="none"/>

               M100 105 V128
               M120 105 L137 124"
        stroke="#789fc7" stroke-width="3"
        stroke-dasharray="4 4" stroke-linecap="round"/>
    `;

  } else {

    const dims = {
      ee: [67, 13],
      ih: [48, 21],
      ae: [49, 38],
      uh: [39, 27]
    }[type] || [45,25];

    shape = `
      <ellipse cx="100" cy="67"
        rx="${dims[0]}" ry="${dims[1]}"
        fill="#894957"
        stroke="#e8a8b7" stroke-width="10"/>

      <path d="M${100-dims[0]*.65} ${67-dims[1]*.35}
               Q100 ${67-dims[1]*.85}
               ${100+dims[0]*.65} ${67-dims[1]*.35}"

        stroke-width="7" stroke-linecap="round"/>

      ${type === "ae" || type === "uh" ? `
        <ellipse cx="100" cy="${67+dims[1]*.52}"
          rx="${dims[0]*.45}" ry="7"
          fill="#e8a0b1"/>
      ` : ""}
    `;
  }

  return `
    <svg viewBox="0 0 200 138"
      role="img" aria-label="발음 기관 모식도">

      <rect width="200" height="138"
        rx="19" fill="#fffefa"/>

      ${shape}
    </svg>
  `;
}

function stopSpeech() {
  speechVersion++;

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

function speak(text, rate = .85, done = null) {
  if (mediaBusy()) {
    alert("마이크 활동을 먼저 종료해 주세요.");
    return false;
  }

  if (!("speechSynthesis" in window)) {
    alert("이 브라우저는 음성 재생을 지원하지 않아요.");
    return false;
  }

  stopSpeech();

  const version = speechVersion;
  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "en-US";
  utterance.rate = rate;

  const voices = speechSynthesis.getVoices();

  utterance.voice =
    voices.find(v => v.lang === "en-US" && v.localService) ||
    voices.find(v => v.lang === "en-US") ||
    voices.find(v => v.lang.startsWith("en")) ||
    null;

  utterance.onend = () => {
    if (version === speechVersion && done) {
      done();
    }
  };

  utterance.onerror = event => {
    if (
      version === speechVersion &&
      event.error !== "canceled" &&
      event.error !== "interrupted"
    ) {
      alert("영어 음성을 재생할 수 없어요. 브라우저와 기기의 음성 설정을 확인해 주세요.");
    }
  };

  speechSynthesis.speak(utterance);

  return true;
}

function speakSequence(words, rate = .8) {
  if (mediaBusy()) {
    alert("마이크 활동을 먼저 종료해 주세요.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    alert("음성 재생을 지원하지 않는 브라우저예요.");
    return;
  }

  stopSpeech();

  const version = speechVersion;

  let index = 0;

  function next() {
    if (
      version !== speechVersion ||
      index >= words.length
    ) return;

    const utterance =
      new SpeechSynthesisUtterance(words[index++]);

    utterance.lang = "en-US";
    utterance.rate = rate;

    const voices = speechSynthesis.getVoices();

    utterance.voice =
      voices.find(v => v.lang === "en-US") ||
      voices.find(v => v.lang.startsWith("en")) ||
      null;

    utterance.onend = () => {
      setTimeout(next, 550);
    };

    utterance.onerror = event => {
      if (
        version === speechVersion &&
        !["canceled","interrupted"].includes(event.error)
      ) {
        alert("음성 재생에 문제가 발생했어요.");
      }
    };

    speechSynthesis.speak(utterance);
  }

  next();
}

if ("speechSynthesis" in window) {
  speechSynthesis.getVoices();
}

        </button>

        <button class="btn btn-white"
          id="record-stop-${key}"
          onclick="stopRecording()"
          disabled>
          ⏹ 녹음 종료
        </button>

      </div>

      <div class="record-status"
        id="record-status-${key}"
        role="status">

        ${recordings[key]
          ? "녹음한 목소리를 들어 보세요."
          : "직접 말하고 자신의 목소리를 들어 보세요."}

      </div>

      <div id="record-audio-${key}">

        ${recordings[key]
          ? `<audio controls src="${recordings[key]}"></audio>`
          : ""}

      </div>

    </div>
  `;
}

async function startRecording(key) {

  if (mediaBusy()) {
    alert("현재 마이크 활동을 먼저 종료해 주세요.");
    return;
  }

  const status = $("record-status-" + key);
  const start = $("record-start-" + key);

  if (
    !navigator.mediaDevices?.getUserMedia ||
    !window.MediaRecorder
  ) {
    status.textContent =
      "녹음을 지원하지 않는 환경이에요. 소리 내어 연습한 뒤 계속 진행할 수 있어요.";
    return;
  }

  stopSpeech();

  document.querySelectorAll("audio").forEach(a => a.pause());

  const originSession = session;
  const originScreen = screenVersion;
  const requestVersion = ++micRequestVersion;

  micPending = true;
  start.disabled = true;

  status.textContent = "마이크 연결 중...";

  let stream;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    if (
      requestVersion !== micRequestVersion ||
      originSession !== session ||
      originScreen !== screenVersion
    ) {
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    micPending = false;

    const recorder = new MediaRecorder(stream);
    const chunks = [];

    const state = {
      recorder,
      stream,
      key,
      session: originSession,
      screen: originScreen,
      timer: null,
      discard: false
    };

    recorderState = state;

    recorder.ondataavailable = e => {
      if (e.data.size) chunks.push(e.data);
    };

    recorder.onstop = () => {
      clearTimeout(state.timer);

      stream.getTracks().forEach(t => t.stop());

      if (recorderState === state) {
        recorderState = null;
      }

      if (
        state.discard ||
        state.session !== session ||
        state.screen !== screenVersion
      ) return;

      const blob = new Blob(chunks, {
        type: recorder.mimeType || "audio/webm"
      });

      const statusEl = $("record-status-" + key);
      const startEl = $("record-start-" + key);
      const stopEl = $("record-stop-" + key);

      if (startEl) startEl.disabled = false;
      if (stopEl) stopEl.disabled = true;

      if (!blob.size) {
        if (statusEl) {
          statusEl.textContent =
            "녹음된 내용이 없어요. 다시 시도해 주세요.";
        }
        return;
      }

      if (recordings[key]) {
        URL.revokeObjectURL(recordings[key]);
      }

      recordings[key] = URL.createObjectURL(blob);

      if ($("record-audio-" + key)) {
        $("record-audio-" + key).innerHTML =
          `<audio controls src="${recordings[key]}"></audio>`;
      }

      if (statusEl) {
        statusEl.textContent =
          "✓ 녹음 완료! 자신의 발음을 들어 보세요.";
      }

      if (startEl) {
        startEl.textContent = "🎙️ 다시 녹음";
      }
    };

    recorder.onerror = () => {
      state.discard = true;

      if (recorder.state !== "inactive") {
        recorder.stop();
      }

      stream.getTracks().forEach(t => t.stop());

      if (recorderState === state) {
        recorderState = null;
      }

      if ($("record-status-" + key)) {
        $("record-status-" + key).textContent =
          "녹음 오류가 발생했어요. 다시 시도해 주세요.";
      }

      if ($("record-start-" + key)) {
        $("record-start-" + key).disabled = false;
      }

      if ($("record-stop-" + key)) {
        $("record-stop-" + key).disabled = true;
      }
    };

    recorder.start();

    $("record-stop-" + key).disabled = false;

    status.textContent = "🔴 녹음 중...";

    state.timer = setTimeout(
      stopRecording,
      key === "bonus" ? 60000 : 20000
    );

  } catch {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    if (requestVersion === micRequestVersion) {
      micPending = false;
      recorderState = null;

      if (start) start.disabled = false;

      if (status) {
        status.textContent =
          "마이크를 사용할 수 없어요. 권한을 확인하거나 녹음 없이 연습해 주세요.";
      }
    }
  }
}

function stopRecording() {
  if (!recorderState) return;

  const state = recorderState;

  clearTimeout(state.timer);

  if (state.recorder.state !== "inactive") {
    state.recorder.stop();
  }

  state.stream.getTracks().forEach(t => t.stop());
}

function clearRecordings() {
  Object.values(recordings).forEach(url => {
    URL.revokeObjectURL(url);
  });

  recordings = {};
}

function stopAllMedia() {
  stopSpeech();

  micRequestVersion++;
  micPending = false;

  if (recorderState) {
    const state = recorderState;

    state.discard = true;
    stopRecording();
    recorderState = null;
  }

  abortRecognition();

  document.querySelectorAll("audio").forEach(audio => {
    audio.pause();
  });
}

function checkExperiment(index) {
  if (answered) return;

  const ex = lesson.experiment;

  if (index !== ex.correct) {
    $("experiment-" + index).classList.add("incorrect");
    $("experiment-" + index).disabled = true;

    setFeedback(
      "experimentFeedback",
      "다시 한번 직접 발음해 보고 소리의 차이를 느껴 보세요!",
      "retry"
    );

    return;
  }

  answered = true;

  $("experiment-" + index).classList.add("correct");

  document.querySelectorAll(".answer-button").forEach(b => {
    b.disabled = true;
  });

  addCoins(30);

  setFeedback(
    "experimentFeedback",
    ex.explanation + " 🪙 30코인을 얻었어요!"
  );

  $("labReveal").classList.remove("hidden");
}

  if (currentView !== "lab" || !answered) return;

  const targets = shuffle([
    0, 1, Math.random() < .5 ? 0 : 1
  ]);

  questions = shuffle(lesson.pairs).map((pair,i) => ({
    pair,
    target: targets[i],
    options: shuffle(pair.map((item,index) => ({
      ...item,
      originalIndex: index
    })))
  }));

  qIndex = 0;

  renderListening();
}

        </button>

      </div>

      <div class="listening-grid">

        ${q.options.map((item,i) => `
          <button class="listening-choice"
            id="listen-choice-${i}"
            onclick="checkListening(${i})"
            disabled>

            <span class="word-icon">
              ${item.icon}
            </span>

            <strong>${item.meaning}</strong>

            <div class="word hidden"
              id="listen-word-${i}"
              style="margin-top:8px;">
              ${item.word}
            </div>

          </button>
        `).join("")}

      </div>

      <div id="listenFeedback"
        class="feedback" role="status">
      </div>

      <div class="button-row hidden"
        id="listenNext">

        <button class="btn btn-blue"
          onclick="nextListening()">

          ${qIndex === 2
            ? "Speaking Studio →"
            : "다음 문제 →"}

        </button>

      </div>

      <div class="button-row">
        <button class="btn btn-white btn-small"
          onclick="skipListening()">
          음성 재생이 어려워요
        </button>
      </div>

    `,

    "listening"
  );
}

function playListening(slow) {
  const q = questions[qIndex];

  const origin = screenVersion;

  speak(
    q.pair[q.target].word,
    slow ? .65 : .9,
    () => {
      if (
        screenVersion !== origin ||
        answered ||
        currentView !== "listening"
      ) return;

      listened = true;

      q.options.forEach((item,i) => {
        const b = $("listen-choice-" + i);

        if (b && !b.classList.contains("incorrect")) {
          b.disabled = false;
        }
      });
    }
  );
}

function checkListening(index) {
  if (!listened || answered) return;

  const q = questions[qIndex];

  if (q.options[index].originalIndex !== q.target) {
    wrongAttempt = true;

    $("listen-choice-" + index)
      .classList.add("incorrect");

    $("listen-choice-" + index).disabled = true;

    setFeedback(
      "listenFeedback",
      "비슷하게 들리는 소리예요. 다시 듣고 차이를 찾아보세요!",
      "retry"
    );

    return;
  }

  answered = true;

  report.listeningTotal++;

  if (!wrongAttempt) {
    report.listeningCorrect++;
  }

  addCoins(10);

  q.options.forEach((item,i) => {
    $("listen-choice-" + i).disabled = true;

    $("listen-word-" + i)
      .classList.remove("hidden");
  });

  $("listen-choice-" + index)
    .classList.add("correct");

  const target = q.pair[q.target];

  setFeedback(
    "listenFeedback",
    `정답! ${target.word} (${target.meaning})였어요. 🪙 +10`
  );

  $("listenNext").classList.remove("hidden");
}

function skipListening() {
  if (answered) return;

  if (!confirm(
    "이 문항을 채점하지 않고 넘어갈까요?"
  )) return;

  answered = true;

  document.querySelectorAll(".listening-choice").forEach(b => {
    b.disabled = true;
  });

  setFeedback(
    "listenFeedback",
    "이 문항은 듣기 결과에 포함하지 않아요.",
    "neutral"
  );

  $("listenNext").classList.remove("hidden");
}

function nextListening() {
  if (!answered) return;

  qIndex++;

  if (qIndex >= 3) {
    stage = 1;
    studioIndex = 0;
    renderStudio();
  } else {
    renderListening();
  }
}

  ].map(([key,label]) => `

function changePlanAllowed() {
  if (recognizing || offer || mediaBusy()) {
    alert(
      "진행 중인 주문이나 마이크 활동을 먼저 마쳐 주세요."
    );

    return false;
  }

  return true;
}

function chooseWord(word) {
  if (!changePlanAllowed()) return;

  if (!lesson.shop.some(item => item.word === word)) {
    return;
  }

  plan.word = word;

  refreshPlan();
}

function chooseColor(color) {
  if (!changePlanAllowed()) return;
  if (!(color in COLORS)) return;

  plan.color = color;

  refreshPlan();
}

function chooseSize(size) {
  if (!changePlanAllowed()) return;

  if (!["normal","small","big"].includes(size)) {
    return;
  }

  plan.size = size;

  refreshPlan();
}

function refreshPlan() {
  renderShop();
  renderCustomOptions();
  renderPrivatePlan();

  $("repairArea").innerHTML = "";
  $("manualArea").classList.add("hidden");

  setFeedback("marketFeedback", "", "neutral");
}

function getItem(word) {
  return lesson?.shop.find(item => item.word === word);
}

function phraseFor(config) {
  return [
    config.size !== "normal" ? config.size : "",
    config.color !== "natural" ? config.color : "",
    config.word
  ].filter(Boolean).join(" ");

===================================================== */

function toggleRecognition() {
  if (recognizing && recognition) {
    try {
      recognition.stop();
    } catch {}
    return;
  }

  startRecognition();
}

function startRecognition() {
  if (currentView !== "world" || offer) return;

  if (mediaBusy()) {
    alert("진행 중인 마이크 활동을 먼저 종료해 주세요.");
    return;
  }

  if (!plan.word) {
    setFeedback(
      "marketFeedback",
      "먼저 원하는 물건을 선택하세요!",
      "retry"
    );
    return;
  }

  if (coins < PRICE) {
    setFeedback(
      "marketFeedback",
      "코인을 모두 사용했어요. 구매한 물건으로 공간을 꾸며 보세요.",
      "neutral"
    );
    return;
  }

  if (!$("voiceConsent").checked) {
    setFeedback(
      "marketFeedback",
      "음성 인식 사용 동의를 확인하거나 직접 확인 모드를 이용해 주세요.",
      "neutral"
    );
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    setFeedback(
      "marketFeedback",
      "이 브라우저에서는 음성 인식을 지원하지 않아요. 직접 확인 모드로 진행할 수 있어요.",
      "neutral"
    );

    showManualOrder();
    return;
  }

  stopSpeech();

  document.querySelectorAll("audio").forEach(a => a.pause());

  const instance = new SpeechRecognition();

  instance.lang = "en-US";
  instance.continuous = false;
  instance.interimResults = false;
  instance.maxAlternatives = 1;

  recognition = instance;
  recognizing = true;

  let receivedResult = false;

  const originSession = session;
  const originScreen = screenVersion;

  $("manualArea").classList.add("hidden");

  $("speakButton").classList.add("recording");
  $("speakButton").textContent =
    "⏹ 말하기 종료";

  $("speechStatus").textContent =
    "마이크 연결 중...";

  $("heardText").classList.add("hidden");

  setFeedback("marketFeedback", "", "neutral");

  renderShop();
  renderCustomOptions();

  function stillActive() {
    return (
      recognition === instance &&
      session === originSession &&
      screenVersion === originScreen
    );
  }

  instance.onstart = () => {
    if (!stillActive()) return;

    $("speechStatus").textContent =
      "🎙️ 지금 영어 문장으로 말해 주세요!";
  };

  instance.onresult = event => {
    if (!stillActive()) return;

    receivedResult = true;

    const transcript =
      event.results[event.resultIndex][0].transcript;

    $("heardText").classList.remove("hidden");

    $("heardText").textContent =
      `${lesson.friend} heard: "${transcript}"`;

    processOrder(transcript);
  };

  instance.onerror = event => {
    if (!stillActive()) return;

    const errors = {
      "no-speech":
        "소리를 듣지 못했어요. 다시 말해 주세요.",
      "not-allowed":
        "마이크 권한이 허용되지 않았어요.",
      "network":
        "음성 인식 연결에 문제가 발생했어요.",
      "audio-capture":
        "마이크를 찾을 수 없어요."
    };

    if (event.error !== "aborted") {

      setFeedback(
        "marketFeedback",
        errors[event.error] ||
          "음성 인식에 문제가 발생했어요.",
        "neutral"
      );
    }
  };

  instance.onend = () => {
    if (!stillActive()) return;

    clearTimeout(recognitionTimer);

    recognition = null;
    recognizing = false;

    resetSpeechButton();

    if (!receivedResult) {
      $("speechStatus").textContent =
        "다시 말하거나 직접 확인할 수 있어요.";
    }

    renderShop();
    renderCustomOptions();
    renderOffer();
  };

  try {
    instance.start();

    recognitionTimer = setTimeout(() => {
      if (recognition === instance) {
        try {
          instance.stop();
        } catch {}
      }
    }, 15000);

  } catch {

    recognition = null;
    recognizing = false;

    resetSpeechButton();
    renderShop();
    renderCustomOptions();

    setFeedback(
      "marketFeedback",
      "음성 인식을 시작하지 못했어요. 직접 확인 모드를 이용해 주세요.",
      "neutral"
    );
  }
}

function resetSpeechButton() {
  const button = $("speakButton");

  if (!button) return;

  button.classList.remove("recording");

  button.textContent =
    "🎙️ 영어 문장으로 주문하기";

  button.disabled =
    Boolean(offer) || coins < PRICE;
}

function abortRecognition() {
  clearTimeout(recognitionTimer);

  if (recognition) {

    const previous = recognition;

    recognition = null;
    recognizing = false;

    previous.onstart = null;
    previous.onresult = null;
    previous.onerror = null;
    previous.onend = null;

    try {
      previous.abort();
    } catch {}
  }

  recognizing = false;
}

/* =====================================================
   13. ORDER INTERPRETATION
   No phoneme accuracy score is generated.
===================================================== */

function normalizeSpeech(text) {
  return String(text)
    .toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/i'd/g, "i would")
    .replace(/don't/g, "do not")
    .replace(/can't/g, "can not")
    .replace(/[^a-z'\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function parseOrder(transcript) {

  const text = normalizeSpeech(transcript);

  /*
    Support common positive orders and repair expressions.

    Examples:
    I want a cap.
    Can I have a big blue cup?
    No, I want a cap, not a cup.
    Not a cup. I want a cap.

    This is keyword-based interpretation, not
    unrestricted natural-language understanding.
  */

  const positiveMarkers = [
    ...text.matchAll(
      /\b(?:i want|i would like|i need|can i have|could i have|may i have|please give me|give me)\b/g
    )
  ];

  let clause = text;

  if (positiveMarkers.length) {

    const marker =
      positiveMarkers[positiveMarkers.length-1];

    clause = text.slice(marker.index);
  }

  clause = clause
    .split(/\b(?:not|instead of|rather than)\b/)[0]
    .trim();

  const words = clause.split(/\s+/).filter(Boolean);

  const matchingItems = lesson.shop.filter(item => {

    if (words.includes(item.word)) return true;

    const plurals = {
      sheep: "sheep",
      fish: "fish"
    };

    const plural = plurals[item.word] ||
      item.word + "s";

    return words.includes(plural);
  });

  if (matchingItems.length !== 1) {
    return {
      ok: false,
      reason:
        matchingItems.length > 1
          ? "물건이 여러 개 들렸어요. 한 번에 하나의 물건을 주문해 주세요."
          : "상점에 있는 물건을 알아듣지 못했어요. 필요한 물건을 문장으로 다시 요청해 주세요."
    };
  }

  const word = matchingItems[0].word;

  const colors = [
    "pink","blue","red","yellow"
  ].filter(color => words.includes(color));

  const sizes = [];

  if (words.includes("big") || words.includes("large")) {
    sizes.push("big");
  }

  if (words.includes("small") || words.includes("little")) {
    sizes.push("small");
  }

  if (colors.length > 1 || sizes.length > 1) {
    return {
      ok: false,
      reason:
        "색깔이나 크기가 여러 가지 들렸어요. 한 물건에 원하는 색깔과 크기를 하나씩 말해 주세요."
    };
  }

  const hasSentence =
    positiveMarkers.length > 0 ||
    (
      words.length >= 3 &&
      /\b(?:i|we|you|my|me|please|have|want|need|like|buy|get|take|choose|pick)\b/.test(clause)
    );

  return {
    ok: true,
    word,
    color: colors[0] || "natural",
    size: sizes[0] || "normal",
    sentence: hasSentence
  };
}

function processOrder(transcript) {

  const parsed = parseOrder(transcript);

  if (!parsed.ok) {

    setFeedback(
      "marketFeedback",
      parsed.reason,
      "neutral"
    );

    $("speechStatus").textContent =
      "한 번 더 말해 보세요.";

    return;
  }

  if (!parsed.sentence) {

    setFeedback(
      "marketFeedback",
      "물건 이름을 알아들었어요! 이번에는 단어만 말하지 말고 영어 문장으로 요청해 보세요.",
      "retry"
    );

    $("speakingHelp").open = true;

    return;
  }

  offer = {
    word: parsed.word,
    color: parsed.color,
    size: parsed.size,
    mode: "speech",
    transcript
  };

  $("shopkeeperText").textContent =
    "Here you go! Is this what you want?";

  $("speechStatus").textContent =
    "친구가 알아들은 물건을 확인해 보세요.";

  $("repairArea").innerHTML = "";

  renderOffer();
}

/* =====================================================
   14. COMMUNICATION REPAIR & PURCHASE
===================================================== */

function configsMatch(a,b) {
  return (
    a.word === b.word &&
    a.color === b.color &&
    a.size === b.size
  );
}

function renderOffer() {
  const root = $("offerArea");

  if (!root) return;

  if (!offer) {

    root.innerHTML = "";
    resetSpeechButton();
    return;
  }

  const item = getItem(offer.word);
  const matches = configsMatch(offer,plan);

  root.innerHTML = `
    <div class="offer">

      <div class="center">

        <span class="tag">
          ${offer.mode === "speech"
            ? "WHAT I HEARD"
            : "YOUR MANUAL ORDER"}
        </span>

      </div>

      <div class="offer-art">
        ${itemSVG(item,offer.color,offer.size)}
      </div>

      <div class="offer-word">
        ${esc(phraseFor(offer))}
      </div>

      <p class="center small muted">
        ${PRICE} coins
      </p>

      <p class="center">

        ${offer.mode === "speech"
          ? "친구가 알아들은 물건이 맞나요?"
          : "직접 확인한 주문 내용이 맞나요?"}

      </p>

      ${!matches ? `
        <div class="feedback retry">

          처음에 선택했던 물건이나 특징과 달라요.
          원했던 것이 맞는지 확인해 보세요.

        </div>
      ` : ""}

      <div class="button-row">

        <button class="btn btn-yellow"
          onclick="confirmPurchase()"
          ${recognizing ? "disabled" : ""}>

          Yes, thank you!

        </button>

        <button class="btn btn-pink"
          onclick="rejectOffer()"
          ${recognizing ? "disabled" : ""}>

          No, try again!

        </button>

      </div>

      ${!matches ? `
        <p class="small muted center">
          마음이 바뀌었다면
          지금 제시된 물건을 구매해도 괜찮아요.
        </p>
      ` : ""}

    </div>
  `;

  resetSpeechButton();
  renderShop();
  renderCustomOptions();
}

function rejectOffer() {

  if (!offer || recognizing) return;

  const oldOffer = {...offer};

  offer = null;

  if (oldOffer.mode === "speech") {
    report.repairs++;
  }

  renderOffer();

  const intended = getItem(plan.word);

  let repairFrame =
    "No, I want a ______, please.";

  let hint = "원하는 물건을 다시 문장으로 말해 보세요.";

  if (intended && oldOffer.word !== plan.word) {

    hint =
      `친구는 ${oldOffer.word}라고 알아들었어요. ` +
      `원했던 단어는 ${plan.word}였죠? ` +
      `두 소리의 차이를 생각하며 다시 말해 보세요.`;

    repairFrame =
      "No, I want a ______, not a ______.";

  } else if (oldOffer.color !== plan.color) {

    hint =
      "물건은 맞지만 색깔이 달라요. 원하는 색깔을 추가해서 다시 요청해 보세요.";

  } else if (oldOffer.size !== plan.size) {

    hint =
      "물건은 맞지만 크기가 달라요. 원하는 크기를 넣어 다시 요청해 보세요.";
  }

  $("shopkeeperText").textContent =
    "Oh, sorry! Could you say that again?";

  $("repairArea").innerHTML = `
    <div class="repair-box">

      <strong>
        💬 Let's try again!
      </strong>

      <p class="small"
        style="margin-top:8px;">
        ${esc(hint)}
      </p>

      <details>

        <summary>표현 힌트</summary>

        <div class="frame">
          ${repairFrame}
        </div>

        ${intended ? `
          <p class="small">
            ${lesson.tips[intended.group].short}
          </p>
        ` : ""}

        <div class="button-row">

          <button class="btn btn-white btn-small"
            onclick="speak('${oldOffer.word}',.8)">
            🔊 ${oldOffer.word}
          </button>

          ${intended ? `
            <button class="btn btn-white btn-small"
              onclick="speak('${intended.word}',.8)">
              🔊 ${intended.word}
            </button>
          ` : ""}

        </div>

      </details>

      <p class="small muted"
        style="margin-bottom:0;">

        음성 인식의 차이가 반드시
        발음이 틀렸다는 뜻은 아니에요.

      </p>

    </div>
  `;

  renderShop();
  renderCustomOptions();
  resetSpeechButton();
}

function confirmPurchase() {

  if (!offer || recognizing) return;

  if (coins < PRICE) {

    setFeedback(
      "marketFeedback",
      "남은 코인이 부족해요.",
      "neutral"
    );

    return;
  }

  const item = getItem(offer.word);

  if (!item) return;

  const purchase = {
    ...item,
    id: nextItemId++,
    color: offer.color,
    size: offer.size,
    mode: offer.mode,
    slot: null
  };

  purchased.push(purchase);

  coins -= PRICE;

  report.purchases++;

  if (offer.mode === "speech") {
    report.recognizedPurchases++;
  } else {
    report.manualPurchases++;
  }

  const purchasePhrase = phraseFor(purchase);

  offer = null;

  plan = {
    word: null,
    color: "natural",
    size: "normal"
  };

  $("shopkeeperText").textContent =
    "Thank you! Enjoy your new item!";

  $("heardText").classList.add("hidden");

  $("repairArea").innerHTML = "";
  $("manualArea").classList.add("hidden");

  setFeedback(
    "marketFeedback",
    `${purchasePhrase} 구매 완료! 인벤토리에 물건이 들어왔어요. 🪙 -${PRICE}`
  );

  $("speechStatus").textContent =
    coins >= PRICE
      ? "다음 물건을 자유롭게 주문해 보세요."
      : "코인을 모두 사용했어요.";

  selectedItemId = purchase.id;

  renderOffer();
  renderPrivatePlan();
  renderShop();
  renderCustomOptions();

  updateCoins();
  updateWorld();
  resetSpeechButton();

  $("placementMessage").textContent =
    `${purchasePhrase}를 배치할 빈자리를 선택하세요.`;

  if (window.innerWidth <= 780) {
    $("worldScene").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }
}

/* =====================================================
   15. MANUAL SPEAKING MODE
===================================================== */

    alert("현재 주문이나 마이크 활동을 먼저 마쳐 주세요.");
    return;
  }

  if (!plan.word) {

    setFeedback(
      "marketFeedback",
      "먼저 원하는 물건을 선택하세요.",
      "retry"
    );

    return;
  }

  if (coins < PRICE) {

    setFeedback(
      "marketFeedback",
      "남은 코인이 부족해요.",
      "neutral"
    );

    return;
  }

  const area = $("manualArea");

  area.classList.remove("hidden");

  area.innerHTML = `
    <div class="manual-box">

      <h3>🗣️ 직접 확인 모드</h3>

      <p class="small">

        먼저 영어 문장으로 주문해 보세요.
        그다음 실제로 말한 물건과 특징을
        아래에서 확인하세요.

      </p>

      <p class="small muted">

        친구나 선생님이 들은 내용을
        대신 선택해 주어도 좋아요.

      </p>

      <label class="small">
        말한 물건
      </label>

      <select id="manualWord">

        <option value="">
          선택하세요
        </option>

        ${lesson.shop.map(item => `
          <option value="${item.word}">
            ${item.word} (${item.meaning})
          </option>
        `).join("")}

      </select>

      <label class="small">
        말한 색깔
      </label>

      <select id="manualColor">

        ${Object.entries(COLORS).map(([key,c]) => `
          <option value="${key}">
            ${c.label}
          </option>
        `).join("")}

      </select>

        말한 크기
      </label>

      <select id="manualSize">

        <option value="normal">기본</option>
        <option value="small">small</option>
        <option value="big">big</option>

      </select>

      <label class="check-line small">

        <input type="checkbox"
          id="manualSpoken">

        위 내용을 영어 문장으로 직접 말했어요.

      </label>

      <div class="button-row">

        <button class="btn btn-blue"
          onclick="submitManualOrder()">
          주문 내용 확인
        </button>

        <button class="btn btn-white"
          onclick="$('manualArea').classList.add('hidden')">
          취소
        </button>

      </div>

      <p class="small muted">

        직접 발화하고 확인하는 활동이에요.

      </p>

    </div>
  `;
}

function submitManualOrder() {
  if (offer || mediaBusy()) return;

  if (!$("manualSpoken").checked) {
    alert("영어 문장으로 먼저 말해 주세요.");
    return;
  }

  const word = $("manualWord").value;

  if (!getItem(word)) {
    alert("말한 물건을 선택하세요.");
    return;
  }

  offer = {
    word,
    color: $("manualColor").value,
    size: $("manualSize").value,
    mode: "manual",
    transcript: null
  };

  $("manualArea").classList.add("hidden");

  $("shopkeeperText").textContent =
    "Is this your order?";

  $("repairArea").innerHTML = "";

  renderOffer();
}

/* =====================================================
   16. WORLD DECORATION
===================================================== */

function updateWorld() {

  const grid = $("placementGrid");
  const inventory = $("inventory");

  if (!grid || !inventory) return;

  grid.innerHTML = Array.from(
    {length: PLOT_COUNT},
    (_,slot) => {

      const item = purchased.find(p => p.slot === slot);

      const isSelected =
        item && selectedItemId === item.id;

      return `
        <button class="plot
          ${item ? "occupied" : ""}
          ${selectedItemId && !item ? "available" : ""}
          ${isSelected ? "selected" : ""}"

          aria-label="${item
            ? esc(item.word) + " 이동"
            : "빈자리 " + (slot+1)}"

          onclick="clickPlot(${slot})"

          ${item ? `
            draggable="true"
            ondragstart="dragItem(event,${item.id})"
            ondragend="dragEnd(event)"
          ` : ""}

          ondragover="allowDrop(event)"
          ondragleave="leaveDrop(event)"
          ondrop="dropItem(event,${slot})">

          ${item ? `
            <div class="placed-art">
              ${itemSVG(item,item.color,item.size)}
            </div>

            <div class="plot-name">
              ${esc(item.word)}
            </div>
          ` : ""}

        </button>
      `;
    }
  ).join("");

  const unplaced =
    purchased.filter(item => item.slot === null);

  inventory.innerHTML = unplaced.length
    ? unplaced.map(item => `
        <button class="inventory-item
          ${selectedItemId === item.id ? "selected" : ""}"

          draggable="true"

          ondragstart="dragItem(event,${item.id})"
          ondragend="dragEnd(event)"

          onclick="selectItem(${item.id})">

          ${itemSVG(item,item.color,item.size)}

          <span>${esc(item.word)}</span>

          ${item.color !== "natural"
            ? `<span class="muted">${item.color}</span>`
            : ""}

        </button>
      `).join("")
    : `
      <div class="inventory-empty">
        ${purchased.length
          ? "모든 물건이 공간에 배치되었어요!"
          : "아직 구매한 물건이 없어요."}
      </div>
    `;

  updateCollection();
}

function selectItem(id) {
  const item = purchased.find(p => p.id === id);

  if (!item) return;

  selectedItemId =
    selectedItemId === id ? null : id;

  updateWorld();

  $("placementMessage").textContent =
    selectedItemId
      ? `${phraseFor(item)}를 배치할 자리를 선택하세요.`
      : "선택이 취소되었어요.";
}

function clickPlot(slot) {

  const occupying =
    purchased.find(p => p.slot === slot);

  if (!selectedItemId) {

    if (occupying) {

      selectedItemId = occupying.id;

      updateWorld();

      $("placementMessage").textContent =
        `${occupying.word}를 이동할 자리를 선택하세요.`;

    } else {

      $("placementMessage").textContent =
        "인벤토리에서 물건을 먼저 선택하세요.";
    }

    return;
  }

  if (occupying && occupying.id === selectedItemId) {

    clearSelection();
    return;
  }

  placeItem(selectedItemId,slot);
}

function placeItem(id,slot) {

  if (
    !Number.isInteger(slot) ||
    slot < 0 ||
    slot >= PLOT_COUNT
  ) return;

  const item = purchased.find(p => p.id === id);

  if (!item) return;

  const occupying =
    purchased.find(p => p.slot === slot);

  if (occupying && occupying.id !== item.id) {

    const previousSlot = item.slot;

    occupying.slot = previousSlot;

    item.slot = slot;

  } else {

    item.slot = slot;
  }

  selectedItemId = null;

  updateWorld();

  $("placementMessage").textContent =
    `✨ ${phraseFor(item)} 배치 완료!`;
}

function returnSelectedItem() {
  const item = purchased.find(
    p => p.id === selectedItemId
  );

  if (!item) {

    $("placementMessage").textContent =
      "보관할 물건을 먼저 선택하세요.";

    return;
  }

  item.slot = null;

  selectedItemId = null;

  updateWorld();

  $("placementMessage").textContent =
    `${item.word}를 인벤토리에 보관했어요.`;
}

function clearSelection() {
  selectedItemId = null;
  updateWorld();

  $("placementMessage").textContent =
    "물건을 선택하면 다시 배치할 수 있어요.";
}

function dragItem(event,id) {
  event.dataTransfer.setData("text/plain",String(id));
  event.dataTransfer.effectAllowed = "move";

  selectedItemId = id;

  document.querySelectorAll(".plot").forEach(plot => {
    plot.classList.add("available");
  });
}

function dragEnd() {
  document.querySelectorAll(".plot").forEach(plot => {
    plot.classList.remove("drag-over");
  });

  updateWorld();
}

function allowDrop(event) {
  event.preventDefault();

  event.dataTransfer.dropEffect = "move";

  event.currentTarget.classList.add("drag-over");
}

function leaveDrop(event) {
  event.currentTarget.classList.remove("drag-over");
}

function dropItem(event,slot) {
  event.preventDefault();

  event.currentTarget.classList.remove("drag-over");

  const id = Number(
    event.dataTransfer.getData("text/plain")
  );

  if (purchased.some(p => p.id === id)) {
    placeItem(id,slot);
  }
}

function updateCollection() {

  const placed =
    purchased.filter(item => item.slot !== null);

  const groups = [
    placed.filter(item => item.group === 0).length,
    placed.filter(item => item.group === 1).length
  ];

  $("collectionProgress").innerHTML =
    groups.map((count,i) => `
      <div class="collection-card
        ${i ? "second" : ""}
        ${count ? "done" : ""}">

        <strong>${lesson.sounds[i]}</strong>

        <div>
          ${count ? "✓ " + count + "개 배치" : "아직 배치하지 않았어요"}
        </div>

      </div>
    `).join("");

  const ready =
    groups[0] > 0 && groups[1] > 0;

  $("finishButton").disabled = !ready;

  $("finishStatus").textContent = ready
    ? "두 목표 소리를 모두 활용했어요! 더 꾸미거나 활동을 마칠 수 있어요."
    : "두 종류의 목표 소리가 포함된 물건을 각각 하나 이상 배치해 주세요.";

  /*
    Avoid getting permanently stuck if all coins were
    spent on only one sound category.

    One rescue coupon per lesson provides enough
    coins for a missing contrastive item.
  */

  if (
    !ready &&
    coins < PRICE &&
    !report.rescueCoupon
  ) {

    const missing = purchased.some(p => p.group === 0) === false ||
      purchased.some(p => p.group === 1) === false;

    if (missing) {

      report.rescueCoupon = true;

      addCoins(PRICE);

      setFeedback(
        "marketFeedback",
        "동물 친구가 두 종류의 소리를 모두 연습할 수 있도록 특별 쿠폰 20코인을 주었어요!",
        "good"
      );

      resetSpeechButton();
    }
  }

  /*
    If a learner spends the rescue coupon on the
    same sound again, allow an exchange to recover
    the price of one item.
  */

  let exchangeButton = $("exchangeButton");

  if (
    !ready &&
    coins < PRICE &&
    purchased.length > 1
  ) {

    if (!exchangeButton) {

      exchangeButton =
        document.createElement("button");

      exchangeButton.id = "exchangeButton";
      exchangeButton.className = "btn btn-white btn-small";

      exchangeButton.textContent =
        "선택한 물건 교환하기 (+20코인)";

      exchangeButton.onclick = exchangeSelectedItem;

      $("collectionProgress").after(exchangeButton);
    }

  } else if (exchangeButton) {
    exchangeButton.remove();
  }
}

function exchangeSelectedItem() {

  if (offer || mediaBusy()) {
    alert("진행 중인 주문을 먼저 마쳐 주세요.");
    return;
  }

  const item = purchased.find(
    p => p.id === selectedItemId
  );

  if (!item) {
    alert("교환할 물건을 먼저 선택하세요.");
    return;
  }

  if (!confirm(
    `${item.word}를 교환하고 20코인을 돌려받을까요?`
  )) return;

  purchased = purchased.filter(
    p => p.id !== item.id
  );

  selectedItemId = null;

  addCoins(PRICE);

  updateWorld();
  resetSpeechButton();
}

/* =====================================================
   19. SAVE WORLD AS PNG
===================================================== */

async function saveWorldImage() {

  if (currentView !== "complete") return;

  const exportKey = lessonKey;
  const exportTitle = lesson.title;
  const exportItems = purchased
    .filter(item => item.slot !== null)
    .map(item => ({...item}));

  const width = 1280;
  const height = 1050;

  const canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  if (!ctx) {
    alert("이미지를 저장할 수 없는 환경이에요.");
    return;
  }

  ctx.fillStyle = "#fffaf1";
  ctx.fillRect(0,0,width,height);

  ctx.textAlign = "center";

  ctx.fillStyle = "#987557";
  ctx.font = "bold 46px Arial";
  ctx.fillText(exportTitle,width/2,63);

  ctx.font = "24px Arial";
  ctx.fillStyle = "#807b75";
  ctx.fillText(
    "My Little Sound World",
    width/2,
    101
  );

  const sceneX = 40;
  const sceneY = 135;
  const sceneW = 1200;
  const sceneH = 880;

  try {

    await drawSVGToCanvas(
      ctx,
      sceneSVG(exportKey),
      sceneX,
      sceneY,
      sceneW,
      sceneH
    );

    const gridX = sceneX + sceneW * .06;
    const gridY = sceneY + sceneH * .31;

    const gridW = sceneW * .88;
    const gridH = sceneH * .64;

    const cellW = gridW / 6;
    const cellH = gridH / 4;

    for (const item of exportItems) {

      const col = item.slot % 6;
      const row = Math.floor(item.slot / 6);

      const x = gridX + col * cellW;
      const y = gridY + row * cellH;

      await drawSVGToCanvas(
        ctx,
        itemSVG(item,item.color,item.size),
        x + 5,
        y + 3,
        cellW - 10,
        cellH - 14
      );

      ctx.font = "bold 20px Arial";
      ctx.textAlign = "center";
      ctx.fillStyle = "#65513b";

      ctx.fillText(
        item.word,
        x + cellW/2,
        y + cellH - 6
      );
    }

    canvas.toBlob(blob => {

      if (!blob) {
        alert("이미지 저장에 실패했어요.");
        return;
      }

      const url = URL.createObjectURL(blob);

      const anchor =
        document.createElement("a");

      anchor.href = url;
      anchor.download =
        exportTitle.replace(/\s+/g,"-") + ".png";

      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      },1000);

    },"image/png");

  } catch {

    alert(
      "이미지를 저장할 수 없어요. 브라우저의 스크린샷 기능으로 공간을 기록할 수 있어요."
    );
  }
}

function drawSVGToCanvas(ctx,svg,x,y,w,h) {

  return new Promise((resolve,reject) => {

    const normalized =
      svg.includes('xmlns="http://www.w3.org/2000/svg"')
        ? svg
        : svg.replace(
            "<svg",
            '<svg xmlns="http://www.w3.org/2000/svg"'
          );

    const blob = new Blob(
      [normalized],
      {type:"image/svg+xml;charset=utf-8"}
    );

    const url = URL.createObjectURL(blob);
    const img = new Image();

    img.onload = () => {
      try {
        ctx.drawImage(img,x,y,w,h);
        resolve();
      } catch (error) {
        reject(error);
      } finally {
        URL.revokeObjectURL(url);
      }
    };

    img.onerror = error => {
      URL.revokeObjectURL(url);
      reject(error);
    };

    img.src = url;
  });
}
